name: Publish WordPress Plugin

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Check browser bridge syntax
        run: node --check wordpress/assets/harika-tracking.js && node --check wordpress/assets/harika-pairing.js
      - name: Check PHP syntax
        run: php -l wordpress/harika-wordpress-connector.php && php -l wordpress/harika-connector-runtime.inc && php -l wordpress/includes/class-harika-control.php && php -l wordpress/includes/class-harika-content-admin.php && php -l wordpress/includes/class-harika-draft-seo.php && php -l wordpress/includes/class-harika-rank-math.php && php -l wordpress/includes/class-harika-status-overlay.php && php -l wordpress/includes/class-harika-authors.php && php -l wordpress/includes/class-harika-pairing.php
      - name: Run connector tests
        run: node --test tests/wordpress-bridge.test.mjs tests/wordpress-pairing-ui.test.mjs && php tests/wordpress-token-crypto.php && php tests/wordpress-pairing.php && php tests/wordpress-pairing-navigation.php && php tests/wordpress-control.php && php tests/wordpress-content-admin.php && php tests/wordpress-authors.php && php tests/wordpress-rank-math.php && php tests/wordpress-updater.php
      - name: Build and verify ZIP
        run: sh scripts/package-wordpress.sh
      - name: Resolve release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^ \* Version: \([0-9][0-9.]*\).*$/\1/p' wordpress/harika-wordpress-connector.php | head -n 1)"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid plugin version: $VERSION" >&2
            exit 1
          fi
          TAG="harika-wordpress-connector-v$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Create version tag
        if: steps.version.outputs.release == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "$TAG"
      - name: Publish GitHub release
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh release create "$TAG" "dist/harika-wordpress-connector-v${VERSION}.zip" dist/harika-wordpress-connector.zip dist/ccf-sites-ads-connector.zip --generate-notes --verify-tag --title "Harika Connector $VERSION"
