name: Check WordPress Plugin

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check browser bridge syntax
        run: node --check wordpress/assets/harika-tracking.js && node --check wordpress/assets/harika-pairing.js
      - name: Check PHP syntax
        run: php -l wordpress/harika-wordpress-connector.php && php -l wordpress/harika-connector-runtime.inc && php -l wordpress/includes/class-harika-control.php && php -l wordpress/includes/class-harika-content-admin.php && php -l wordpress/includes/class-harika-draft-seo.php && php -l wordpress/includes/class-harika-rank-math.php && php -l wordpress/includes/class-harika-status-overlay.php && php -l wordpress/includes/class-harika-authors.php && php -l wordpress/includes/class-harika-pairing.php
      - name: Run connector tests
        run: node --test tests/wordpress-bridge.test.mjs && php tests/wordpress-token-crypto.php && php tests/wordpress-pairing.php && php tests/wordpress-control.php && php tests/wordpress-content-admin.php && php tests/wordpress-authors.php && php tests/wordpress-rank-math.php && php tests/wordpress-updater.php
      - name: Build and verify ZIP
        run: sh scripts/package-wordpress.sh
